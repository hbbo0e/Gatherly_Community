spring:
  application:
    name: Gatherly_Community
  datasource:
    driver-class-name: org.h2.Driver
    database-platform: org.hibernate.dialect.H2Dialect
    url: jdbc:h2:mem:gatherlycommunity
    initialize: true
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

#  동일 이름의 빈이 있을 경우 덮어쓰기 허용
  main:
    allow-bean-definition-overriding: true

logging:
  level:
    org.springframework: DEBUG

