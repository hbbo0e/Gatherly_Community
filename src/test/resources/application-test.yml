spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:Gatherly_Community
    initialize: true
    username: sa
    password:
  h2:
    console:
      enabled: true
    path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true
        show_sql: true